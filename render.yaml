# Render blueprint: New > Blueprint > pick this repo. Public HTTPS. GOOGLE_MAPS_KEY is optional.
services:
  - type: web
    name: ridesync
    runtime: docker
    plan: free  # sleeps when idle: open the link a few minutes before judging
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_NOW
        value: "06:10"
      - key: GOOGLE_MAPS_KEY
        sync: false  # typed into the Render dashboard, never committed
